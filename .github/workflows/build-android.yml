name: Build Patchy Native Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Install Qt 6.10.3 Desktop
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtdeclarative qtsvg qttools qtimageformats'
          cache: true

      - name: Save host Qt path
        run: |
          echo "HOST_QT_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt 6.10.3 Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtdeclarative qtsvg qttools qtimageformats'
          cache: true

      - name: Configure Patchy
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" \
            -S . \
            -B build/android-release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPATCHY_BUILD_APP=ON \
            -DPATCHY_BUILD_TESTS=OFF \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DQT_ANDROID_MIN_SDK_VERSION=28 \
            -DQT_ANDROID_TARGET_SDK_VERSION=36 \
            -DQT_ANDROID_PACKAGE_NAME=com.kintokikyo.patchy \
            -DQT_HOST_PATH="$HOST_QT_ROOT" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"

      - name: Build APK
        run: |
          cmake --build build/android-release \
            --target apk \
            --parallel 2

      - name: Find APK
        run: |
          find build/android-release -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: patchy-native-android
          path: |
            build/android-release/**/*.apk
            build/android-release/*.apk
          if-no-files-found: error
