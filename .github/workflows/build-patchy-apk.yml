name: Build Patchy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout Patchy
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Emscripten
        shell: pwsh
        run: |
          pwsh -File scripts/wasm/setup-emsdk.ps1

      - name: Setup Qt WebAssembly
        shell: pwsh
        run: |
          pwsh -File scripts/wasm/setup-qt-wasm.ps1

      - name: Build Patchy WASM
        shell: cmd
        run: |
          call .deps\emsdk\emsdk_env.bat
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          cmake --preset wasm-release
          cmake --build --preset wasm-release

      - name: Prepare Patchy Android Web Site
        shell: pwsh
        run: |
          $assets = "app/src/main/assets/patchy"

          if (Test-Path $assets) {
            Remove-Item $assets -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $assets | Out-Null

          $build = "build/wasm-release"

          Copy-Item "$build/patchy.js" "$assets/"
          Copy-Item "$build/patchy.wasm" "$assets/"
          Copy-Item "$build/patchy.data" "$assets/"
          Copy-Item "$build/qtloader.js" "$assets/"

          Copy-Item `
            "packaging/linux/icons/hicolor/256x256/apps/com.rtsoft.patchy.png" `
            "$assets/patchy-logo.png"

          Copy-Item `
            "src/app/patchy.ico" `
            "$assets/favicon.ico"

          Copy-Item `
            "NOTICE-THIRD-PARTY.md" `
            "$assets/NOTICE-THIRD-PARTY.md"

          Copy-Item `
            "src/formats/libheif/COPYING" `
            "$assets/libheif-COPYING.txt"

          $cmake = Get-Content "CMakeLists.txt" -Raw

          $match = [regex]::Match(
            $cmake,
            'project\s*\([\s\S]*?\bVERSION\s+([0-9]+(?:\.[0-9]+){1,3})',
            [Text.RegularExpressions.RegexOptions]::IgnoreCase
          )

          if ($match.Success) {
            $version = $match.Groups[1].Value
          } else {
            $version = "0.0.0"
          }

          $cacheTag = "$version-$([DateTime]::UtcNow.ToString('yyyyMMddHHmmss'))"

          $wasmSize = (Get-Item "$build/patchy.wasm").Length
          $wasmSizeST = 0

          $template = Get-Content `
            "packaging/web/patchy.html.in" `
            -Raw

          $html = $template.Replace("__PATCHY_VERSION__", $version)
          $html = $html.Replace("__PATCHY_CACHE_TAG__", $cacheTag)
          $html = $html.Replace("__PATCHY_WASM_SIZE__", "$wasmSize")
          $html = $html.Replace("__PATCHY_WASM_SIZE_ST__", "$wasmSizeST")

          if ($html -match "__PATCHY_") {
            throw "Patchy HTML still contains unreplaced placeholders."
          }

          Set-Content `
            -LiteralPath "$assets/patchy.html" `
            -Value $html `
            -NoNewline `
            -Encoding UTF8

          Write-Host "Patchy web site prepared."

      - name: Build Android APK
        shell: cmd
        run: |
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: patchy-android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
