name: Build Patchy Native Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Create test keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/patchy-test.keystore" \
            -alias patchy \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass patchy123 \
            -keypass patchy123 \
            -dname "CN=Patchy, OU=Kintokikyo, O=Patchy, L=Indonesia, ST=Indonesia, C=ID"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Install Qt 6.10.3 Desktop
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtimageformats'
          cache: true

      - name: Save host Qt path
        run: |
          echo "HOST_QT_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt 6.10.3 Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtimageformats'
          cache: true

      # ============================================================
      # KEEP THE WORKING EGL PATCH
      # ============================================================

      - name: Patch Qt Android eglSurface deadlock fallback
        run: |
          echo "===== PATCH QT ANDROID eglSurface ====="

          QT_EGL_PLUGIN=$(find "$QT_ROOT_DIR" \
            -type f \
            -name "libplugins_platforms_qtforandroid_arm64-v8a.so" \
            -print -quit)

          if [ -z "$QT_EGL_PLUGIN" ]; then
            echo "ERROR: Qt Android platform plugin not found"
            exit 1
          fi

          echo "Qt plugin: $QT_EGL_PLUGIN"

          python3 - "$QT_EGL_PLUGIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = bytearray(path.read_bytes())

          old = bytes.fromhex(
              "48008052 61fcffd0 213c1c91 e81300b9 68fcff90"
              "08dd1091 1f2003d5 e252c870 e0430091 b5000094"
          )

          new = bytes.fromhex(
              "e0c30091 030a0094 e0031faa f7ffff17"
              "1f2003d5 1f2003d5 1f2003d5 1f2003d5"
              "1f2003d5 1f2003d5"
          )

          if len(old) != 40 or len(new) != 40:
              raise SystemExit("ERROR: patch byte length mismatch")

          occurrences = data.count(old)

          if occurrences != 1:
              raise SystemExit(
                  f"ERROR: expected exactly 1 matching Qt 6.10.3 sequence, "
                  f"found {occurrences}"
              )

          offset = data.index(old)

          print(f"eglSurface patch offset: 0x{offset:x}")

          data[offset:offset + len(old)] = new
          path.write_bytes(data)

          verify = path.read_bytes()

          if verify[offset:offset + len(new)] != new:
              raise SystemExit("ERROR: eglSurface patch verification failed")

          print("eglSurface patch verification: OK")
          print("Working EGL deadlock fallback patch preserved.")
          PY

          echo "===== VERIFY EGL PATCH ====="
          ls -l "$QT_EGL_PLUGIN"

      # ============================================================
      # DIAGNOSTIC:
      #
      # QDockWidgetPrivate::endDrag()
      #
      # 0x450580:
      #     bl operator delete
      #
      # ORIGINAL:
      #     1c 07 08 94
      #
      # DIAGNOSTIC:
      #     00 00 20 d4
      #     brk #0
      #
      # We intentionally STOP before operator delete.
      # ============================================================

      - name: Patch QtWidgets 0x450580 BRK diagnostic
        run: |
          echo "===== PATCH QT WIDGETS 0x450580 BRK ====="

          QT_WIDGETS=$(find "$QT_ROOT_DIR" \
            -type f \
            -name "libQt6Widgets_arm64-v8a.so" \
            -print -quit)

          if [ -z "$QT_WIDGETS" ]; then
            echo "ERROR: QtWidgets Android binary not found"
            exit 1
          fi

          echo "QtWidgets: $QT_WIDGETS"

          python3 - "$QT_WIDGETS" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = bytearray(path.read_bytes())

          # Qt 6.10.3 ARM64
          #
          # QDockWidgetPrivate::endDrag()
          #
          # 0x45057c:
          #     ldr x0, [x19,#0x260]
          #
          # 0x450580:
          #     bl operator delete
          #
          # 0x450584:
          #     str xzr, [x19,#0x260]
          #
          # We patch ONLY 0x450580 so we can catch the caller
          # before the DragState deletion happens.

          offset = 0x450580

          old = bytes.fromhex("1c 07 08 94")

          # ARM64:
          #     brk #0
          new = bytes.fromhex("00 00 20 d4")

          actual = bytes(data[offset:offset + 4])

          print(f"Patch offset: 0x{offset:x}")
          print(f"Original bytes: {actual.hex(' ')}")

          if actual != old:
              raise SystemExit(
                  "ERROR: QtWidgets bytes do not match expected original "
                  "instruction at 0x450580"
              )

          data[offset:offset + 4] = new
          path.write_bytes(data)

          verify = path.read_bytes()

          if verify[offset:offset + 4] != new:
              raise SystemExit(
                  "ERROR: QtWidgets 0x450580 BRK verification failed"
              )

          print("Patched bytes:", new.hex(" "))
          print("Patch verification: OK")
          print("QtWidgets 0x450580 BRK diagnostic patch applied.")
          PY

          echo "===== VERIFY QT WIDGETS ====="
          ls -l "$QT_WIDGETS"

      # ============================================================
      # IMPORTANT:
      #
      # Verify that 0x450328 remains ORIGINAL.
      #
      # It must NOT contain BRK.
      # Expected:
      #     00 11 00 f9
      #
      # Also verify 0x450584 remains ORIGINAL:
      #     7f 32 01 f9
      # ============================================================

      - name: Verify QtWidgets diagnostic layout
        run: |
          echo "===== VERIFY QT WIDGETS DIAGNOSTIC LAYOUT ====="

          QT_WIDGETS=$(find "$QT_ROOT_DIR" \
            -type f \
            -name "libQt6Widgets_arm64-v8a.so" \
            -print -quit)

          python3 - "$QT_WIDGETS" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = path.read_bytes()

          # 0x450328 must remain ORIGINAL.
          off_450328 = 0x450328
          expected_450328 = bytes.fromhex("00 11 00 f9")
          actual_450328 = data[off_450328:off_450328 + 4]

          print(
              f"0x450328: "
              f"{actual_450328.hex(' ')}"
          )

          if actual_450328 != expected_450328:
              raise SystemExit(
                  "ERROR: 0x450328 was modified unexpectedly"
              )

          # 0x450580 must contain BRK.
          off_450580 = 0x450580
          expected_450580 = bytes.fromhex("00 00 20 d4")
          actual_450580 = data[off_450580:off_450580 + 4]

          print(
              f"0x450580: "
              f"{actual_450580.hex(' ')}"
          )

          if actual_450580 != expected_450580:
              raise SystemExit(
                  "ERROR: 0x450580 BRK patch is missing"
              )

          # 0x450584 must remain ORIGINAL.
          off_450584 = 0x450584
          expected_450584 = bytes.fromhex("7f 32 01 f9")
          actual_450584 = data[off_450584:off_450584 + 4]

          print(
              f"0x450584: "
              f"{actual_450584.hex(' ')}"
          )

          if actual_450584 != expected_450584:
              raise SystemExit(
                  "ERROR: 0x450584 was modified unexpectedly"
              )

          print("")
          print("QtWidgets diagnostic layout verification: OK")
          print("0x450328 = ORIGINAL")
          print("0x450580 = BRK")
          print("0x450584 = ORIGINAL")
          PY

      # ============================================================
      # PREPARE ANDROID MANIFEST
      # ============================================================

      - name: Prepare Qt Android manifest
        run: |
          echo "===== FIND QT ANDROID TEMPLATE ====="

          QT_ANDROID_TEMPLATE=$(find "$QT_ROOT_DIR" \
            -path "*/src/android/templates/Android