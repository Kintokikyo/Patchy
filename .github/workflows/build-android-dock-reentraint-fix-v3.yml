name: Build Patchy Android - Dock Reentrant Fix

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT PATCHY
      # ============================================================
      - name: Checkout Patchy
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      # ============================================================
      # 4. TEST KEYSTORE
      # ============================================================
      - name: Create test keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/patchy-test.keystore" \
            -alias patchy \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass patchy123 \
            -keypass patchy123 \
            -dname "CN=Patchy, OU=Kintokikyo, O=Patchy, L=Indonesia, ST=Indonesia, C=ID"

      # ============================================================
      # 5. INSTALL HOST QT 6.10.3
      # ============================================================
      - name: Install Qt 6.10.3 Desktop
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtimageformats'
          cache: true

      - name: Save host Qt path
        run: |
          echo "HOST_QT_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 6. INSTALL ORIGINAL QT 6.10.3 ANDROID
      # ============================================================
      - name: Install Qt 6.10.3 Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtimageformats'
          cache: true

      # ============================================================
      # 7. SAVE ORIGINAL QT ANDROID TREE
      # ============================================================
      - name: Save original Qt Android tree
        run: |
          echo "===== SAVE ORIGINAL QT ANDROID TREE ====="

          rm -rf "$GITHUB_WORKSPACE/qt-android-original"

          cp -a "$QT_ROOT_DIR" \
            "$GITHUB_WORKSPACE/qt-android-original"

          echo "Original Qt Android tree saved."

      # ============================================================
      # 8. PATCH EGL
      #
      # IMPORTANT:
      # This is the SAME working EGL patch.
      # DO NOT CHANGE THESE BYTES.
      # ============================================================
      - name: Patch Qt Android eglSurface deadlock fallback
        run: |
          echo "===== PATCH QT ANDROID eglSurface ====="

          QT_EGL_PLUGIN=$(find "$QT_ROOT_DIR" \
            -type f \
            -name "libplugins_platforms_qtforandroid_arm64-v8a.so" \
            -print -quit)

          if [ -z "$QT_EGL_PLUGIN" ]; then
            echo "ERROR: Qt Android platform plugin not found"
            exit 1
          fi

          echo "Qt plugin: $QT_EGL_PLUGIN"

          python3 - "$QT_EGL_PLUGIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = bytearray(path.read_bytes())

          old = bytes.fromhex(
              "48008052 61fcffd0 213c1c91 e81300b9 68fcff90"
              "08dd1091 1f2003d5 e252c870 e0430091 b5000094"
          )

          new = bytes.fromhex(
              "e0c30091 030a0094 e0031faa f7ffff17"
              "1f2003d5 1f2003d5 1f2003d5 1f2003d5"
              "1f2003d5 1f2003d5"
          )

          if len(old) != 40 or len(new) != 40:
              raise SystemExit("ERROR: EGL patch byte length mismatch")

          occurrences = data.count(old)

          if occurrences != 1:
              raise SystemExit(
                  f"ERROR: expected exactly 1 matching EGL sequence, "
                  f"found {occurrences}"
              )

          offset = data.index(old)

          print(f"EGL patch offset: 0x{offset:x}")

          data[offset:offset + len(old)] = new

          path.write_bytes(data)

          verify = path.read_bytes()

          if verify[offset:offset + len(new)] != new:
              raise SystemExit(
                  "ERROR: EGL patch verification failed"
              )

          print("EGL patch verification: OK")
          print("Working eglSurface patch preserved.")
          PY

          echo "===== VERIFY EGL PLUGIN ====="
          ls -lh "$QT_EGL_PLUGIN"

      # ============================================================
      # 9. CLONE QTBASE 6.10.3 SOURCE
      # ============================================================
      - name: Clone QtBase 6.10.3 source
        run: |
          echo "===== CLONE QTBASE 6.10.3 ====="

          rm -rf "$GITHUB_WORKSPACE/qtbase"

          git clone \
            --depth 1 \
            --branch v6.10.3 \
            https://code.qt.io/qt/qtbase.git \
            "$GITHUB_WORKSPACE/qtbase"

          cd "$GITHUB_WORKSPACE/qtbase"

          echo "QtBase commit:"
          git rev-parse HEAD

      # ============================================================
      # 10. PATCH QDOCKWIDGET.CPP
      # ============================================================
      - name: Patch Qt QDockWidget reentrant drag handling
        run: |
          echo "===== PATCH QT QDOCKWIDGET ====="

          QT_DOCK="$GITHUB_WORKSPACE/qtbase/src/widgets/widgets/qdockwidget.cpp"
          QT_DOCK_P="$GITHUB_WORKSPACE/qtbase/src/widgets/widgets/qdockwidget_p.h"

          if [ ! -f "$QT_DOCK" ]; then
            echo "ERROR: qdockwidget.cpp not found"
            exit 1
          fi

          if [ ! -f "$QT_DOCK_P" ]; then
            echo "ERROR: qdockwidget_p.h not found"
            exit 1
          fi

          python3 - "$QT_DOCK" "$QT_DOCK_P" <<'PY'
          import sys
          from pathlib import Path

          cpp = Path(sys.argv[1])
          header = Path(sys.argv[2])

          cpp_text = cpp.read_text()
          header_text = header.read_text()

          old = """    bool ownWidgetItem;
          bool nca;
          bool ctrlDrag;
          };"""

          new = """    bool ownWidgetItem;
          bool nca;
          bool ctrlDrag;

          bool startingDrag = false;
          bool abortPending = false;
          bool releasePending = false;
          };"""

          if old not in header_text:
              raise SystemExit("ERROR: DragState block not found in qdockwidget_p.h")

          if header_text.count(old) != 1:
              raise SystemExit("ERROR: DragState block occurrence is not exactly 1")

          header_text = header_text.replace(old, new, 1)

          old = """    state->ownWidgetItem = false;
          state->nca = nca;
          state->ctrlDrag = false;
          }"""

          new = """    state->ownWidgetItem = false;
          state->nca = nca;
          state->ctrlDrag = false;
          state->startingDrag = false;
          state->abortPending = false;
          state->releasePending = false;
          }"""

          if old not in cpp_text:
              raise SystemExit("ERROR: initDrag initialization block not found")

          if cpp_text.count(old) != 1:
              raise SystemExit("ERROR: initDrag initialization block occurrence is not exactly 1")

          cpp_text = cpp_text.replace(old, new, 1)

          old = """    state->widgetItem = layout->unplug(q, scope);"""

          new = """    state->startingDrag = true;
          state->widgetItem = layout->unplug(q, scope);"""

          if old not in cpp_text:
              raise SystemExit("ERROR: startDrag unplug line not found")

          if cpp_text.count(old) != 1:
              raise SystemExit("ERROR: startDrag unplug line occurrence is not exactly 1")

          cpp_text = cpp_text.replace(old, new, 1)

          old = """    state->dragging = true;

          #if QT_CONFIG(draganddrop)"""

          new = """    state->dragging = true;
          state->startingDrag = false;

          if (state->abortPending) {
              state->abortPending = false;
              state->releasePending = false;
              endDrag(QDockWidgetPrivate::EndDragMode::Abort);
              return;
          }

          if (state->releasePending) {
              state->releasePending = false;
              endDrag(QDockWidgetPrivate::EndDragMode::LocationChange);
              return;
          }

          #if QT_CONFIG(draganddrop)"""

          if old not in cpp_text:
              raise SystemExit("ERROR: startDrag completion block not found")

          if cpp_text.count(old) != 1:
              raise SystemExit("ERROR: startDrag completion block occurrence is not exactly 1")

          cpp_text = cpp_text.replace(old, new, 1)

          old = """    if (state != nullptr)
              endDrag(QDockWidgetPrivate::EndDragMode::Abort);"""

          new = """    if (state != nullptr) {
              if (state->startingDrag)
                  state->abortPending = true;
              else
                  endDrag(QDockWidgetPrivate::EndDragMode::Abort);
          }"""

          if old not in cpp_text:
              raise SystemExit("ERROR: setFloating() state block not found")

          if cpp_text.count(old) != 1:
              raise SystemExit("ERROR: setFloating() state block occurrence is not exactly 1")

          cpp_text = cpp_text.replace(old, new, 1)

          old = """    if (event->button() == Qt::LeftButton && state && !state->nca) {
              endDrag(EndDragMode::LocationChange);
              return true; //filter out the event
          }"""

          new = """    if (event->button() == Qt::LeftButton && state && !state->nca) {
              if (state->startingDrag) {
                  state->releasePending = true;
                  return true; //filter out the event
              }

              endDrag(EndDragMode::LocationChange);
              return true; //filter out the event
          }"""

          if old not in cpp_text:
              raise SystemExit("ERROR: mouseReleaseEvent() block not found")

          if cpp_text.count(old) != 1:
              raise SystemExit("ERROR: mouseReleaseEvent() block occurrence is not exactly 1")

          cpp_text = cpp_text.replace(old, new, 1)

          header.write_text(header_text)
          cpp.write_text(cpp_text)

          required_header = [
              "bool startingDrag = false;",
              "bool abortPending = false;",
              "bool releasePending = false;",
          ]

          required_cpp = [
              "state->startingDrag = true;",
              "state->startingDrag = false;",
              "state->abortPending = true;",
              "state->releasePending = true;",
              "if (state->abortPending)",
              "if (state->releasePending)",
              "if (state->startingDrag)",
          ]

          h = header.read_text()
          c = cpp.read_text()

          for marker in required_header:
              if marker not in h:
                  raise SystemExit(f"ERROR: required header marker missing: {marker}")

          for marker in required_cpp:
              if marker not in c:
                  raise SystemExit(f"ERROR: required source marker missing: {marker}")

          print("HEADER PATCH VERIFICATION: OK")
          print("SOURCE PATCH VERIFICATION: OK")
          PY

          echo "===== PATCHED QDOCKWIDGET CHECK ====="
          grep -n -E "startingDrag|abortPending|releasePending" "$QT_DOCK_P" "$QT_DOCK"
      # ============================================================
      # 11. CONFIGURE QTBASE ANDROID
      # ============================================================
      - name: Configure patched QtBase Android
        run: |
          echo "===== CONFIGURE QTBASE ANDROID ====="

          rm -rf "$GITHUB_WORKSPACE/qtbase-build"
          rm -rf "$GITHUB_WORKSPACE/qtbase-install"

          mkdir -p "$GITHUB_WORKSPACE/qtbase-build"

          cd "$GITHUB_WORKSPACE/qtbase-build"

          "$GITHUB_WORKSPACE/qtbase/configure" \
            -release \
            -android \
            -android-abis arm64-v8a \
            -android-sdk "$ANDROID_SDK_ROOT" \
            -android-ndk "$ANDROID_NDK_ROOT" \
            -android-platform android-36 \
            -qt-host-path "$HOST_QT_ROOT" \
            -prefix "$GITHUB_WORKSPACE/qtbase-install" \
            -nomake tests \
            -nomake examples \
            -no-warnings-are-errors

      # ============================================================
      # 12. BUILD ONLY QT WIDGETS
      # ============================================================
      - name: Build patched QtWidgets
        run: |
          echo "===== BUILD PATCHED QTWIDGETS ====="

          cd "$GITHUB_WORKSPACE/qtbase-build"

          cmake --build . \
            --target Qt6Widgets \
            --parallel 2

      # ============================================================
      # 13. LOCATE PATCHED QTWIDGETS
      # ============================================================
      - name: Locate patched QtWidgets library
        run: |
          echo "===== FIND PATCHED QTWIDGETS ====="

          PATCHED_WIDGETS=$(find "$GITHUB_WORKSPACE/qtbase-build" \
            -type f \
            -name "libQt6Widgets_arm64-v8a.so" \
            -print -quit)

          if [ -z "$PATCHED_WIDGETS" ]; then
            echo "ERROR: patched libQt6Widgets_arm64-v8a.so not found"
            exit 1
          fi

          echo "Patched QtWidgets:"
          echo "$PATCHED_WIDGETS"

          ls -lh "$PATCHED_WIDGETS"

          echo "PATCHED_WIDGETS=$PATCHED_WIDGETS" >> "$GITHUB_ENV"

      # ============================================================
      # 14. VERIFY SOURCE PATCH + BINARY EXISTS
      # ============================================================
      - name: Verify patched QtWidgets build
        run: |
          echo "===== VERIFY PATCHED QT WIDGETS BUILD ====="

          if [ -z "$PATCHED_WIDGETS" ]; then
            echo "ERROR: PATCHED_WIDGETS environment variable is empty"
            exit 1
          fi

          if [ ! -f "$PATCHED_WIDGETS" ]; then
            echo "ERROR: patched QtWidgets library does not exist"
            exit 1
          fi

          SIZE=$(stat -c%s "$PATCHED_WIDGETS")

          echo "Patched QtWidgets size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: QtWidgets library is suspiciously small"
            exit 1
          fi

          echo "QtWidgets build verification: OK"

      # ============================================================
      # 15. PREPARE PATCHED QT ANDROID TREE
      #
      # Start from ORIGINAL tree, which already contains the EGL
      # patch.
      #
      # Then replace ONLY QtWidgets.
      # ============================================================
      - name: Prepare patched Qt Android tree
        run: |
          echo "===== PREPARE PATCHED QT ANDROID TREE ====="

          rm -rf "$GITHUB_WORKSPACE/qt-android-patched"

          cp -a \
            "$GITHUB_WORKSPACE/qt-android-original" \
            "$GITHUB_WORKSPACE/qt-android-patched"

          ORIGINAL_WIDGETS=$(find \
            "$GITHUB_WORKSPACE/qt-android-patched" \
            -type f \
            -name "libQt6Widgets_arm64-v8a.so" \
            -print -quit)

          if [ -z "$ORIGINAL_WIDGETS" ]; then
            echo "ERROR: original QtWidgets library not found"
            exit 1
          fi

          echo "Original QtWidgets:"
          echo "$ORIGINAL_WIDGETS"

          cp "$PATCHED_WIDGETS" "$ORIGINAL_WIDGETS"

          echo "Only QtWidgets was replaced."

          QT_EGL_PLUGIN=$(find \
            "$GITHUB_WORKSPACE/qt-android-patched" \
            -type f \
            -name "libplugins_platforms_qtforandroid_arm64-v8a.so" \
            -print -quit)

          if [ -z "$QT_EGL_PLUGIN" ]; then
            echo "ERROR: EGL plugin missing after overlay"
            exit 1
          fi

          echo "EGL plugin still exists:"
          ls -lh "$QT_EGL_PLUGIN"

          echo "QT_ROOT_DIR=$GITHUB_WORKSPACE/qt-android-patched" >> "$GITHUB_ENV"

      # ============================================================
      # 16. VERIFY EGL PATCH STILL EXISTS AFTER OVERLAY
      # ============================================================
      - name: Verify working EGL patch survived overlay
        run: |
          echo "===== VERIFY EGL PATCH AFTER OVERLAY ====="

          QT_EGL_PLUGIN=$(find \
            "$GITHUB_WORKSPACE/qt-android-patched" \
            -type f \
            -name "libplugins_platforms_qtforandroid_arm64-v8a.so" \
            -print -quit)

          if [ -z "$QT_EGL_PLUGIN" ]; then
            echo "ERROR: EGL plugin not found"
            exit 1
          fi

          python3 - "$QT_EGL_PLUGIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = path.read_bytes()

          expected = bytes.fromhex(
              "e0c30091 030a0094 e0031faa f7ffff17"
              "1f2003d5 1f2003d5 1f2003d5 1f2003d5"
              "1f2003d5 1f2003d5"
          )

          count = data.count(expected)

          print(f"EGL patched sequence occurrences: {count}")

          if count != 1:
              raise SystemExit(
                  "ERROR: working EGL patch is missing or duplicated"
              )

          print("EGL PATCH SURVIVAL VERIFICATION: OK")
          PY

      # ============================================================
      # 17. PREPARE ANDROID MANIFEST
      # ============================================================
      - name: Prepare Qt Android manifest
        run: |
          echo "===== FIND QT ANDROID TEMPLATE ====="

          QT_ANDROID_TEMPLATE=$(find "$QT_ROOT_DIR" \
            -path "*/src/android/templates/AndroidManifest.xml" \
            -print -quit)

          echo "Template: $QT_ANDROID_TEMPLATE"

          if [ -z "$QT_ANDROID_TEMPLATE" ]; then
            echo "ERROR: Qt AndroidManifest.xml template not found"
            exit 1
          fi

          cp "$QT_ANDROID_TEMPLATE" android/AndroidManifest.xml

          echo "===== PATCH MANIFEST ====="

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/AndroidManifest.xml")
          text = path.read_text()

          text = text.replace(
              'android:screenOrientation="unspecified"',
              'android:screenOrientation="landscape"'
          )

          text = text.replace(
              '    package="org.qtproject.qt.example"',
              '',
              1
          )

          text = text.replace(
              '<activity',
              '<activity android:theme="@android:style/Theme.Material.NoActionBar"',
              1
          )

          text = text.replace(
              'android:name="org.qtproject.qt.android.bindings.QtActivity"',
              'android:name="com.kintokikyo.patchy.MainActivity"',
              1
          )

          path.write_text(text)
          PY

          echo "===== FINAL MANIFEST ====="
          cat android/AndroidManifest.xml

      # ============================================================
      # 18. CONFIGURE PATCHY USING PATCHED QT TREE
      # ============================================================
      - name: Configure Patchy
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/patchy-test.keystore
          QT_ANDROID_KEYSTORE_ALIAS: patchy
          QT_ANDROID_KEYSTORE_STORE_PASS: patchy123
          QT_ANDROID_KEYSTORE_KEY_PASS: patchy123
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" \
            -S . \
            -B build/android-release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPATCHY_BUILD_APP=ON \
            -DPATCHY_BUILD_TESTS=OFF \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DQT_ANDROID_MIN_SDK_VERSION=28 \
            -DQT_ANDROID_TARGET_SDK_VERSION=36 \
            -DQT_ANDROID_PACKAGE_NAME=com.kintokikyo.patchy \
            -DQT_HOST_PATH="$HOST_QT_ROOT" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ENABLE_VERBOSE_DEPLOYMENT=ON \
            -DQT_ANDROID_SIGN_APK=ON

      # ============================================================
      # 19. BUILD APK
      # ============================================================
      - name: Build APK
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/patchy-test.keystore
          QT_ANDROID_KEYSTORE_ALIAS: patchy
          QT_ANDROID_KEYSTORE_STORE_PASS: patchy123
          QT_ANDROID_KEYSTORE_KEY_PASS: patchy123
        run: |
          cmake --build build/android-release \
            --target apk \
            --parallel 2

      # ============================================================
      # 20. VERIFY APK CONTAINS QTWIDGETS
      # ============================================================
      - name: Verify QtWidgets inside APK
        run: |
          echo "===== VERIFY QT WIDGETS INSIDE APK ====="

          APK=$(find build/android-release \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          mkdir -p /tmp/apk_verify

          unzip -p "$APK" \
            "lib/arm64-v8a/libQt6Widgets_arm64-v8a.so" \
            > /tmp/apk_verify/libQt6Widgets_arm64-v8a.so

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "/tmp/apk_verify/libQt6Widgets_arm64-v8a.so"
          )

          if not path.exists():
              raise SystemExit(
                  "ERROR: QtWidgets not found inside APK"
              )

          data = path.read_bytes()

          print(f"APK QtWidgets size: {len(data)}")

          if len(data) < 1000000:
              raise SystemExit(
                  "ERROR: APK QtWidgets library is suspiciously small"
              )

          print("APK QtWidgets verification: OK")
          PY

      # ============================================================
      # 21. VERIFY EGL PATCH INSIDE APK
      # ============================================================
      - name: Verify EGL patch inside APK
        run: |
          echo "===== VERIFY EGL PATCH INSIDE APK ====="

          APK=$(find build/android-release \
            -type f \
            -name "*.apk" \
            -print -quit)

          mkdir -p /tmp/apk_egl_verify

          unzip -p "$APK" \
            "lib/arm64-v8a/libplugins_platforms_qtforandroid_arm64-v8a.so" \
            > /tmp/apk_egl_verify/libplugins_platforms_qtforandroid_arm64-v8a.so

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "/tmp/apk_egl_verify/"
              "libplugins_platforms_qtforandroid_arm64-v8a.so"
          )

          data = path.read_bytes()

          expected = bytes.fromhex(
              "e0c30091 030a0094 e0031faa f7ffff17"
              "1f2003d5 1f2003d5 1f2003d5 1f2003d5"
              "1f2003d5 1f2003d5"
          )

          count = data.count(expected)

          print(f"APK EGL patched sequence occurrences: {count}")

          if count != 1:
              raise SystemExit(
                  "ERROR: working EGL patch is NOT present inside APK"
              )

          print("APK EGL PATCH VERIFICATION: OK")
          PY

      # ============================================================
      # 22. FIND APK
      # ============================================================
      - name: Find APK
        run: |
          echo "===== APK FILES ====="

          find build/android-release \
            -type f \
            -name "*.apk" \
            -print

      # ============================================================
      # 23. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: patchy-native-android-dock-reentrant-fix
          path: |
            build/android-release/**/*.apk
            build/android-release/*.apk
          if-no-files-found: error
